    <!-- Outlook add-in launcher: built by apps/outlook-addin (npm run build) into one file served by GitHub Pages. It holds no data and no token. -->

    <style>
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
        background: #f3f5f8; color: #1b2430; font: 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .card { width: 100%; max-width: 420px; padding: 20px; border: 1px solid #d6dce4; border-radius: 4px; background: #fff; }
      .card p { margin: 0 0 16px; line-height: 1.45; }
      button {
        height: 32px; padding: 0 14px; margin: 0 8px 8px 0; font: inherit; cursor: pointer;
        border: 1px solid #00489b; border-radius: 4px; background: #00489b; color: #fff;
      }
      button:hover { background: #003a7d; }
      button.secondary { background: transparent; color: #00489b; }
      button:disabled { opacity: .5; cursor: default; }
      @media (prefers-color-scheme: dark) {
        body { background: #12161c; color: #e4e8ee; }
        .card { background: #1b2129; border-color: #2c3440; }
        button.secondary { color: #8fb8ea; border-color: #8fb8ea; }
      }
    </style>
